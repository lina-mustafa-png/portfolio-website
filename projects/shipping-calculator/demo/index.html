<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="UTF-8"/> <!-- describes the charcter system used -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <!-- proper display on different screen sizes -->
        <title>Shipping Calculator Demo</title>
        <link rel="stylesheet" href="shipping-style.css"/>
        <link rel="icon" type="image/png" href="favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:ital,wght@0,100..900;1,100..900&family=Andada+Pro:ital,wght@0,400..840;1,400..840&display=swap" rel="stylesheet">
        <body>
            <button id="backbtn1"> <img src="../../../backbtn.png" width="20" height="20"> Back</button>

            <h1>Shipping Cost Calculator</h1>
            <label id="label1">Parcel Type</label>
            <select id="type">
                <option value="Option">Select</option>
                <option value="standard">Standard</option>
                <option value="express">Express</option>
                <option value="international">International</option>
            </select>

            <label id="label2"><br>Weight (kg)</label>
            <input id="weight" type="number">

            <label id="label3"><br>Distance (km)</label>
            <input id="distance" type="number">

            <label id="label4"><br>Size</label>
            <select id="size">
                <option value="Option">Select</option>
                <option value="S">Small</option>
                <option value="M">Medium</option>
                <option value="L">Large</option>
            </select>

            <label id="label5"><br>Insurance</label>
            <input id="insurance" type="checkbox">

            <label id="label6"><br>Same Day Delivery<br></label>
            <input id="sameDayDel" type="checkbox">

            <button id="btn1" onClick="calculateCost()">Calculate Cost</button>
            <h2 id="result"></h2>

            <script src="shipping-script.js"></script>

            <script>
                document.getElementById("backbtn1").onclick = function () {
                    window.location.href = "../../../java.html";
                };
            </script>
        </body>
    </head>
</html>

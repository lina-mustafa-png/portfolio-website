<!DOCTYPE html>
<html lang="en">
    <head> 
    <!-- info about webpage -->
        <meta charset="UTF-8"/> <!-- describes the charcter system used -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <!-- proper display on different screen sizes -->
        <title>lina's portfolio</title>
        <link rel="stylesheet" href="style.css"/>
        <link rel="icon" type="image/png" href="favicon.png">
        <!-- fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600&family=Andada+Pro:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
    </head>

    <body>
    <!-- visibility on webpage -->
        <main class="hero">
            <div class="animation">
                <!-- background desk -->
                <img class="desk" src="images/desk.png" alt="Illustrated desk workspace">
                <!-- coffee cup -->
                <img class="coffee-cup" src="images/coffee-cup.png" alt="Illustrated cup of coffee">
                
                <!-- laptop -->               
                <div class="laptop-wrapper">
                    <img class="laptop" src="images/laptop.png" alt="Illustrated computer">
                    
                    <div class="computer-screen">

                        <pre class="screen-code"><code><span class="keyword">int</span> <span class="function">main</span><span class="symbol">() {</span>
                        <span class="printf">printf</span><span class="symbol">(</span><span class="string">"Hello, World!"</span><span class="symbol">);</span>
                        <span class="keyword">return</span><span class="number">0</span><span class="symbol">;</span>
                    <span class="symbol">}</span><span class="code-cursor"></span></code></pre>

                        <div class="error">
                            <span>ERROR</span>
                            <small>SYSTEM FAILURE</small>
                        </div>

                        <h1 class="name">Lina Mustafa</h1>
                    </div>
                </div>                
                <!-- coffee spill -->
                <img class="coffee-spill" src="images/coffee-spill.png" alt="Illustrated cup of spilt coffee">
        </div>

        <section class="introduction">
            <h2 class="typewriter">Software Engineering Portfolio</h2>
        </section>
        <a class="scroll-link" href="#menu">
            <span>↓</span>
        </a>
        </main>

        <section id="menu" class="menu">
            <div class="menu-buttons">
                <button id="projectsbtn" style="text-align: center;">Projects</button>
            </div>
        </section>

            <h1 style="text-align: center;">Lina Mustafa's</h1>
            <h2 style="text-align: center;">Portfolio</h2>
            <p id="p1" style="text-align: center;">Software development and design</p>
        </div> -->

        <script src="script.js"></script>
    </body>
</html>
